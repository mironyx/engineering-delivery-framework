name: CI (Python)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - run: uv sync
      - run: ./scripts/run-typecheck.sh
      - run: ./scripts/run-lint.sh
      - run: ./scripts/run-build.sh
      - run: ./scripts/run-markdown-lint.sh
      - run: ./scripts/run-format-check.sh
      - run: ./scripts/run-tests.sh
