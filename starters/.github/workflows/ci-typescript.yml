name: CI (TypeScript)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: ./scripts/run-typecheck.sh
      - run: ./scripts/run-lint.sh
      - run: ./scripts/run-build.sh
      - run: ./scripts/run-markdown-lint.sh
      - run: ./scripts/run-format-check.sh
      - run: ./scripts/run-tests.sh
